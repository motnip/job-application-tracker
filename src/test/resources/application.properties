spring.application.name=job-application-tracker
server.port=8080

spring.jpa.open-in-view=false
spring.sql.init.continue-on-error=false

# Enable OpenAPI documentation
springdoc.api-docs.enabled=false

# Customize the OpenAPI path (default: /v3/api-docs)
springdoc.api-docs.path=/v1/api-docs

#TOMAS questa la buttiamo via e ci mettiamo Postgresql
#Più avanti possiamo fare in modo che in dev environment
#Puoi far partire tutto da Spring e vafancù
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/jobapp-db
spring.datasource.username=jobapp-admin
spring.datasource.password=tomas0584!


#init database
#Drive by Hibernate for creating database table and puts data
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
#spring.jpa.generate-ddl=true
#script-based DataSource initialization to be able to build upon the schema creation by Hibernate
spring.datasource.initialize=true
#spring.jpa.properties.hibernate.hbm2ddl.import_files=init-db.sql